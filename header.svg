<svg fill="none" viewBox="0 0 830 220" width="830" height="220" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        @keyframes fadeIn {
          0% { opacity: 0; transform: translateY(8px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes lineExpand {
          0% { width: 0; }
          100% { width: 60px; }
        }
        .container {
          background: linear-gradient(-45deg, #0a0c10, #0d1117, #131920, #0f1318, #0d1117);
          background-size: 400% 400%;
          animation: gradient 20s ease infinite;
          width: 100%;
          height: 220px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          position: relative;
          overflow: hidden;
        }
        .container::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: radial-gradient(ellipse at 30% 50%, rgba(88,166,255,0.04) 0%, transparent 60%),
                      radial-gradient(ellipse at 70% 50%, rgba(136,108,255,0.03) 0%, transparent 60%);
          pointer-events: none;
        }
        .name {
          font-size: 48px;
          font-weight: 700;
          color: #e6edf3;
          margin: 0;
          letter-spacing: -0.03em;
          animation: fadeIn 0.8s ease-out both;
          line-height: 1.1;
        }
        .line {
          height: 1px;
          background: linear-gradient(90deg, transparent, #30363d, transparent);
          margin: 14px 0;
          animation: lineExpand 1s ease-out 0.4s both;
        }
        .subtitle {
          font-size: 13px;
          color: #8b949e;
          margin: 0;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          animation: fadeIn 0.8s ease-out 0.6s both;
          font-weight: 400;
        }
        .dot {
          display: inline-block;
          margin: 0 10px;
          color: #30363d;
        }
        @media (prefers-reduced-motion) {
          .container { animation: none; }
          .name, .subtitle { animation: none; }
          .line { animation: none; width: 60px; }
        }
        @media (prefers-color-scheme: light) {
          .container {
            background: linear-gradient(-45deg, #f6f8fa, #ffffff, #f0f3f6, #f6f8fa);
            background-size: 400% 400%;
            animation: gradient 20s ease infinite;
          }
          .container::before {
            background: radial-gradient(ellipse at 30% 50%, rgba(9,105,218,0.03) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 50%, rgba(130,80,223,0.02) 0%, transparent 60%);
          }
          .name { color: #1f2328; }
          .subtitle { color: #656d76; }
          .line { background: linear-gradient(90deg, transparent, #d0d7de, transparent); }
          .dot { color: #d0d7de; }
        }
      </style>
      <div class="container">
        <h1 class="name">Sergio Cano</h1>
        <div class="line"></div>
        <p class="subtitle">Full-Stack Developer<span class="dot">/</span>Health Tech<span class="dot">/</span>SaaS</p>
      </div>
    </div>
  </foreignObject>
</svg>
