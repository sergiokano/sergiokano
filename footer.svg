<svg fill="none" viewBox="0 0 830 60" width="830" height="60" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        .footer {
          width: 100%;
          height: 60px;
          display: flex;
          justify-content: center;
          align-items: center;
          background: transparent;
        }
        .line {
          width: 100%;
          height: 1px;
          background: linear-gradient(90deg, transparent 0%, #30363d 20%, #58a6ff22 50%, #30363d 80%, transparent 100%);
          background-size: 200% 100%;
          animation: gradient 8s ease infinite;
        }
        @media (prefers-reduced-motion) {
          .line { animation: none; }
        }
        @media (prefers-color-scheme: light) {
          .line { background: linear-gradient(90deg, transparent 0%, #d0d7de 20%, #0969da22 50%, #d0d7de 80%, transparent 100%); background-size: 200% 100%; animation: gradient 8s ease infinite; }
        }
      </style>
      <div class="footer">
        <div class="line"></div>
      </div>
    </div>
  </foreignObject>
</svg>
